<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Jason Liu - holy paladin profile card" shape-rendering="crispEdges">
  <title>Jason Liu - holy paladin profile card</title>
  <desc>Pixel JRPG holy paladin guild card profile banner for Jason Liu.</desc>

  <defs>
    <pattern id="sanctum" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#0b1026"/>
      <rect x="8" y="12" width="4" height="4" fill="#1e3a8a"/>
      <rect x="34" y="28" width="4" height="4" fill="#facc15"/>
      <rect x="52" y="48" width="2" height="2" fill="#bfdbfe"/>
    </pattern>
    <style>
      .mono { font-family: Georgia, "Times New Roman", serif; font-variant: small-caps; }
      .tiny { font-size: 16px; letter-spacing: 3px; font-weight: 700; }
      .label { font-size: 18px; letter-spacing: 1px; font-weight: 700; }
      .name { font-size: 62px; letter-spacing: 6px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="380" fill="url(#sanctum)"/>

  <!-- Holy card shell -->
  <rect x="104" y="64" width="1088" height="284" fill="#030712"/>
  <rect x="88" y="48" width="1088" height="284" fill="#111827"/>
  <rect x="104" y="64" width="1056" height="252" fill="#1e293b"/>
  <rect x="120" y="80" width="1024" height="220" fill="#fefce8"/>
  <rect x="136" y="96" width="992" height="188" fill="#1e1b4b"/>

  <!-- Pixel cut corners and gold trim -->
  <rect x="88" y="48" width="32" height="32" fill="#0b1026"/>
  <rect x="1144" y="48" width="32" height="32" fill="#0b1026"/>
  <rect x="88" y="300" width="32" height="32" fill="#0b1026"/>
  <rect x="1144" y="300" width="32" height="32" fill="#0b1026"/>
  <rect x="120" y="48" width="1024" height="16" fill="#facc15"/>
  <rect x="120" y="316" width="1024" height="16" fill="#facc15"/>
  <rect x="88" y="80" width="16" height="220" fill="#facc15"/>
  <rect x="1160" y="80" width="16" height="220" fill="#facc15"/>
  <rect x="136" y="96" width="992" height="8" fill="#bfdbfe"/>
  <rect x="136" y="276" width="992" height="8" fill="#bfdbfe"/>

  <!-- Top ribbons -->
  <rect x="152" y="80" width="408" height="32" fill="#020617"/>
  <rect x="160" y="88" width="392" height="16" fill="#b45309"/>
  <text x="176" y="102" class="mono tiny" fill="#fef3c7">HOLY GUILD CARD // PALADIN</text>

  <rect x="848" y="80" width="252" height="32" fill="#020617"/>
  <rect x="856" y="88" width="236" height="16" fill="#1d4ed8"/>
  <text x="874" y="102" class="mono tiny" fill="#dbeafe">BLUE TEAM WARDEN</text>

  <!-- Full-body paladin battle screen frame from the provided sprite sheet. -->
  <rect x="168" y="120" width="148" height="148" fill="#020617"/>
  <rect x="180" y="132" width="124" height="116" fill="#0f172a"/>
  <rect x="184" y="248" width="116" height="12" fill="#334155"/>
  <rect x="194" y="244" width="88" height="4" fill="#facc15"/>
  <ellipse cx="242" cy="260" rx="52" ry="8" fill="#020617" opacity="0.55"/>
  <g transform="translate(202 126) scale(5)" image-rendering="pixelated">
    <image width="16" height="24" href="data:image/png;base64,">
      <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.34;0.67;1" dur="2400ms" calcMode="discrete" repeatCount="indefinite"/>
    </image>
    <image width="16" height="24" href="data:image/png;base64,">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.34;0.67;1" dur="2400ms" calcMode="discrete" repeatCount="indefinite"/>
    </image>
    <image width="16" height="24" href="data:image/png;base64,">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.34;0.67;1" dur="2400ms" calcMode="discrete" repeatCount="indefinite"/>
    </image>
  </g>

  <!-- Identity -->
  <text x="368" y="176" class="mono name" fill="#f8fafc">Jason Liu</text>
  <text x="374" y="214" class="mono label" fill="#bfdbfe">@kelbimon</text>
  <text x="374" y="244" class="mono label" fill="#fde68a">Fullstack / Martech / Holy Blue Team</text>

  <!-- Relic slots -->
  <g class="mono tiny" font-weight="700">
    <rect x="152" y="292" width="72" height="36" fill="#020617"/>
    <text x="174" y="316" fill="#bfdbfe">TS</text>
    <rect x="236" y="292" width="72" height="36" fill="#020617"/>
    <text x="258" y="316" fill="#86efac">PY</text>
    <rect x="320" y="292" width="72" height="36" fill="#020617"/>
    <text x="338" y="316" fill="#c4b5fd">PHP</text>
    <rect x="404" y="292" width="72" height="36" fill="#020617"/>
    <text x="422" y="316" fill="#fde68a">SQL</text>
    <rect x="488" y="292" width="72" height="36" fill="#020617"/>
    <text x="510" y="316" fill="#e5e7eb">GH</text>
  </g>

  <!-- Build tag kept for the existing date-refresh workflow. -->
  <text x="1112" y="316" class="mono tiny" fill="#fef3c7" text-anchor="end">built 2026-07-09</text>
</svg>
