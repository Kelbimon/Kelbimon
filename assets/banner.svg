<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Jason Liu - @kelbimon" shape-rendering="crispEdges">
  <title>Jason Liu - @kelbimon</title>
  <desc>Pixel JRPG guild card profile banner for Jason Liu.</desc>

  <defs>
    <pattern id="stars" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#111827"/>
      <rect x="8" y="12" width="4" height="4" fill="#334155"/>
      <rect x="34" y="30" width="4" height="4" fill="#1d4ed8"/>
      <rect x="20" y="38" width="2" height="2" fill="#93c5fd"/>
    </pattern>
    <style>
      .mono { font-family: "Courier New", monospace; }
      .tiny { font-size: 15px; letter-spacing: 2px; }
      .label { font-size: 16px; letter-spacing: 1px; font-weight: 700; }
      .name { font-size: 54px; letter-spacing: 4px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#stars)"/>

  <!-- Pixel guild-card shadow -->
  <rect x="104" y="56" width="1088" height="232" fill="#050816"/>
  <rect x="88" y="40" width="1088" height="232" fill="#0f172a"/>
  <rect x="104" y="56" width="1056" height="200" fill="#1e293b"/>
  <rect x="120" y="72" width="1024" height="168" fill="#f8fafc"/>
  <rect x="136" y="88" width="992" height="136" fill="#172554"/>

  <!-- Pixel cut corners -->
  <rect x="88" y="40" width="32" height="32" fill="#111827"/>
  <rect x="1144" y="40" width="32" height="32" fill="#111827"/>
  <rect x="88" y="240" width="32" height="32" fill="#111827"/>
  <rect x="1144" y="240" width="32" height="32" fill="#111827"/>
  <rect x="120" y="40" width="1024" height="16" fill="#60a5fa"/>
  <rect x="120" y="256" width="1024" height="16" fill="#60a5fa"/>
  <rect x="88" y="72" width="16" height="168" fill="#60a5fa"/>
  <rect x="1160" y="72" width="16" height="168" fill="#60a5fa"/>

  <!-- Top ribbon -->
  <rect x="152" y="72" width="360" height="32" fill="#020617"/>
  <rect x="160" y="80" width="344" height="16" fill="#1d4ed8"/>
  <text x="176" y="93" class="mono tiny" fill="#dbeafe">GUILD CARD // KELBIMON</text>

  <!-- Blue-team badge -->
  <rect x="876" y="72" width="224" height="32" fill="#020617"/>
  <rect x="884" y="80" width="208" height="16" fill="#0f766e"/>
  <text x="902" y="93" class="mono tiny" fill="#ccfbf1">BLUE TEAM FOCUS</text>

  <!-- Portrait slot / crest -->
  <rect x="168" y="124" width="132" height="76" fill="#020617"/>
  <rect x="184" y="140" width="100" height="44" fill="#1e40af"/>
  <path d="M234 134 L278 150 L278 170 L234 194 L190 170 L190 150 Z" fill="#93c5fd"/>
  <path d="M234 144 L266 156 L266 168 L234 184 L202 168 L202 156 Z" fill="#172554"/>
  <rect x="228" y="152" width="12" height="24" fill="#facc15"/>
  <rect x="216" y="164" width="36" height="8" fill="#facc15"/>

  <!-- Identity -->
  <text x="336" y="158" class="mono name" fill="#f8fafc">JASON LIU</text>
  <text x="340" y="192" class="mono label" fill="#93c5fd">@kelbimon</text>
  <text x="340" y="218" class="mono label" fill="#fde68a">FULLSTACK / MARTECH / BLUE TEAM</text>

  <!-- Bottom item slots -->
  <g class="mono tiny" font-weight="700">
    <rect x="152" y="232" width="72" height="32" fill="#020617"/>
    <text x="174" y="254" fill="#93c5fd">TS</text>
    <rect x="236" y="232" width="72" height="32" fill="#020617"/>
    <text x="258" y="254" fill="#86efac">PY</text>
    <rect x="320" y="232" width="72" height="32" fill="#020617"/>
    <text x="338" y="254" fill="#c4b5fd">PHP</text>
    <rect x="404" y="232" width="72" height="32" fill="#020617"/>
    <text x="422" y="254" fill="#fde68a">SQL</text>
    <rect x="488" y="232" width="72" height="32" fill="#020617"/>
    <text x="510" y="254" fill="#e5e7eb">GH</text>
  </g>

  <!-- Build tag kept for the existing date-refresh workflow. -->
  <text x="1112" y="254" class="mono tiny" fill="#bfdbfe" text-anchor="end">built 2026-07-09</text>
